# 毎朝 6:17（日本時間）に、Buffer の予約を埋め足して統計を集める。手で動かすときは Actions の画面の「Run workflow」
name: daily
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 予約の埋め足しと数字集め
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/fill_queue.py
      - name: 統計
        if: always()
        run: python3 scripts/analyze.py
      - name: 記録を残す
        if: always()
        run: |
          git config user.name "kintai-reels-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily $(date -u +%F)"
          git pull --rebase -q && git push -q
      - name: 知らせ（あれば赤くしてメール）
        run: |
          if [ -s data/alert.txt ]; then cat data/alert.txt; exit 1; fi
